name: Build e release

on:
  push:
    branches: [main, 'claude/**']
    # Tag v* publica a release (filtro de paths não vale para tags). Hífen na tag = pré-lançamento.
    tags: ['v*']
    paths: ['src/**', 'tools/**', 'tests/**', 'android/**', 'script.js', 'player/**', '.github/workflows/build-release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v8.6.5). Vazio = só build, sem release'
        required: false
        default: ''
      notes:
        description: 'Arquivo de notas (ex.: docs/release-v8.6.5.md)'
        required: false
        default: ''
      target:
        description: 'Commit da tag (vazio = commit deste build)'
        required: false
        default: ''
      apk:
        description: 'Anexar o APK Android à release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ferramentas Android (sem SDK)
        run: sudo apt-get update -q && sudo apt-get install -y -q aapt dalvik-exchange zipalign apksigner
      - name: Userscript e testes
        run: |
          python3 tools/build.py
          git diff --exit-code -- better-xcloud-image-filter.user.js output/restoration.bundle.js || { echo "::error::Arquivos gerados desatualizados: rode python3 tools/build.py e faça commit"; exit 1; }
          node --test tests/*.cjs
          node --check better-xcloud-image-filter.user.js
          node --check player/player.js
      - name: Regressões WebGL e DOM
        run: |
          python3 -m pip install playwright==1.60.0
          python3 -m playwright install --with-deps chromium
          # capture-harness tem falha intermitente de tempo (docs/spec1-estudo.md): uma nova tentativa, nunca pular.
          python3 tools/run-browser-tests.py || { echo "::warning::Testes de navegador falharam; repetindo uma vez"; python3 tools/run-browser-tests.py; }
      - name: Falhas dos testes de navegador como anotações
        if: failure()
        run: |
          python3 - <<'PY' || true
          import json
          r = json.load(open('output/playwright/results.json', encoding='utf-8'))
          for x in (r if isinstance(r, list) else r.get('results', r)):
              if x.get('ok'):
                  continue
              res = x.get('result') or {}
              msg = res.get('error') or json.dumps(res.get('failures'), ensure_ascii=False)
              print(f"::error title={x['suite']}::{str(msg)[:900]}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: output/playwright/results.json
      - name: APK
        run: android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: xcloud-imagefilter
          path: |
            better-xcloud-image-filter.user.js
            android/dist/*.apk
      - name: Publicar release
        if: (github.event_name == 'workflow_dispatch' && inputs.tag != '') || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          NOTES: ${{ inputs.notes }}
          TARGET: ${{ inputs.target || github.sha }}
          APK: ${{ github.event_name == 'push' || inputs.apk }}
        run: |
          # Tag sem notas informadas: docs/release-<tag sem sufixo>.md (v9.8.0-beta.2 -> docs/release-v9.8.0.md).
          if [ -z "$NOTES" ]; then NOTES="docs/release-${TAG%%-*}.md"; fi
          test -f "$NOTES" || { echo "::error::Notas não encontradas: $NOTES"; exit 1; }
          TITLE=$(head -1 "$NOTES" | sed 's/^# *//')
          tail -n +2 "$NOTES" > /tmp/notes.md
          FILES=(better-xcloud-image-filter.user.js)
          if [ "$APK" = "true" ]; then FILES+=(android/dist/*.apk); fi
          PRE=(); case "$TAG" in *-*) PRE=(--prerelease);; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" "${PRE[@]}" \
              --target "$TARGET" --title "$TITLE" --notes-file /tmp/notes.md
          fi
